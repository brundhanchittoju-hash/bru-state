# Netlify Configuration when base directory is set directly to frontend/

[build]
  publish = "dist"
  command = "npm run build"

[build.environment]
  NODE_VERSION = "20"
  VITE_ENABLE_DEMO_LOGIN = "false"
  SECRETS_SCAN_OMIT_KEYS = "VITE_API_URL"
  SECRETS_SCAN_ENABLED = "false"

# Netlify API proxy (proxies all /api/* requests directly to Render backend)
[[redirects]]
  from = "/api/*"
  to = "https://bru-state.onrender.com/api/:splat"
  status = 200
  force = true

# SPA client-side routing fallback (for React Router deep links)
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Security and cache headers
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

